services:
  peas-reporting-postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: peas_reporting_test
      POSTGRES_PASSWORD: peas_reporting_test
      POSTGRES_DB: peas_reporting_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peas_reporting_test -d peas_reporting_test"]
      interval: 1s
      timeout: 3s
      retries: 30
