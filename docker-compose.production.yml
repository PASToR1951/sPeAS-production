services:
  db:
    image: ${PEAS_POSTGRES_IMAGE:?set PEAS_POSTGRES_IMAGE to a pinned PostgreSQL image digest}
    environment:
      POSTGRES_DB: peas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
      - db_app_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peas_db"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    image: ${PEAS_IMAGE:?set PEAS_IMAGE to a pinned PeAS image digest}
    command: ["task", "db:migrate:apply"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DENO_ENV: production
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD_FILE: /run/secrets/db_admin_password
      PGDATABASE: peas_db
      PEAS_RELEASE_ID: ${PEAS_RELEASE_ID:?set PEAS_RELEASE_ID}
    secrets:
      - db_admin_password
    networks: [backend]
    restart: "no"

  app:
    image: ${PEAS_IMAGE:?set PEAS_IMAGE to a pinned PeAS image digest}
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      PORT: "8000"
      DENO_ENV: production
      PGHOST: db
      PGPORT: "5432"
      PGUSER: peas_app
      PGPASSWORD_FILE: /run/secrets/db_app_password
      PGDATABASE: peas_db
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      PEAS_RELEASE_ID: ${PEAS_RELEASE_ID:?set PEAS_RELEASE_ID}
      STORAGE_ROOT: /app/storage
      NEWS_MEDIA_WORKER_ENABLED: "false"
      DOCUMENT_ANNOTATIONS_ENABLED: ${DOCUMENT_ANNOTATIONS_ENABLED:-true}
      NEWS_MEDIA_CLAMAV_ENABLED: "true"
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_TLS: ${SMTP_TLS:-true}
      CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:?set CONTACT_RECIPIENT_EMAIL}
      ABSTRACT_OCR_LANGUAGES: ${ABSTRACT_OCR_LANGUAGES:-eng+fil}
      PEAS_CSP_MODE: ${PEAS_CSP_MODE:-report-only}
      TRUSTED_PROXY_RANGES: ${TRUSTED_PROXY_RANGES:?set TRUSTED_PROXY_RANGES}
      SECURITY_CONTACT_EMAIL: ${SECURITY_CONTACT_EMAIL:?set SECURITY_CONTACT_EMAIL}
      SECURITY_TXT_EXPIRES: ${SECURITY_TXT_EXPIRES:?set SECURITY_TXT_EXPIRES}
    expose: ["8000"]
    secrets:
      - db_app_password
      - better_auth_secret
      - smtp_password
    volumes:
      - storage-data:/app/storage
      - logs-data:/app/Deno/logs
    networks: [edge, backend]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "deno", "eval", "try { const response = await fetch('http://localhost:8000/health/ready'); Deno.exit(response.ok ? 0 : 1); } catch (_) { Deno.exit(1); }"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  media-worker:
    image: ${PEAS_IMAGE:?set PEAS_IMAGE}
    command: ["task", "media-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      DENO_ENV: production
      PGHOST: db
      PGPORT: "5432"
      PGUSER: peas_app
      PGPASSWORD_FILE: /run/secrets/db_app_password
      PGDATABASE: peas_db
      STORAGE_ROOT: /app/storage
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      NEWS_MEDIA_CLAMAV_ENABLED: "true"
    secrets: [db_app_password, better_auth_secret]
    volumes: ["storage-data:/app/storage"]
    networks: [backend]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  abstract-worker:
    image: ${PEAS_IMAGE:?set PEAS_IMAGE}
    command: ["task", "abstract:worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DENO_ENV: production
      PGHOST: db
      PGPORT: "5432"
      PGUSER: peas_app
      PGPASSWORD_FILE: /run/secrets/db_app_password
      PGDATABASE: peas_db
      STORAGE_ROOT: /app/storage
      PEAS_RELEASE_ID: ${PEAS_RELEASE_ID:?set PEAS_RELEASE_ID}
      ABSTRACT_OCR_LANGUAGES: ${ABSTRACT_OCR_LANGUAGES:-eng+fil}
    secrets: [db_app_password]
    volumes: ["storage-data:/app/storage"]
    networks: [backend]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  clamav:
    image: ${PEAS_CLAMAV_IMAGE:?set PEAS_CLAMAV_IMAGE to a pinned ClamAV image digest}
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 2:1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  caddy:
    image: ${PEAS_CADDY_IMAGE:?set PEAS_CADDY_IMAGE to a pinned Caddy image digest}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

networks:
  edge:
    ipam:
      config:
        - subnet: ${PEAS_EDGE_SUBNET:-172.30.0.0/24}
  backend:
    internal: true

volumes:
  postgres-data:
    name: ${PEAS_POSTGRES_VOLUME:-peas-prod-postgres}
  storage-data:
    name: ${PEAS_STORAGE_VOLUME:-peas-prod-storage}
  logs-data:
    name: ${PEAS_LOGS_VOLUME:-peas-prod-logs}
  caddy-data:
    name: ${PEAS_CADDY_DATA_VOLUME:-peas-prod-caddy-data}
  caddy-config:
    name: ${PEAS_CADDY_CONFIG_VOLUME:-peas-prod-caddy-config}

secrets:
  db_admin_password:
    file: ${PEAS_SECRETS_DIR:?set PEAS_SECRETS_DIR}/db_admin_password
  db_app_password:
    file: ${PEAS_SECRETS_DIR:?set PEAS_SECRETS_DIR}/db_app_password
  better_auth_secret:
    file: ${PEAS_SECRETS_DIR:?set PEAS_SECRETS_DIR}/better_auth_secret
  smtp_password:
    file: ${PEAS_SECRETS_DIR:?set PEAS_SECRETS_DIR}/smtp_password
