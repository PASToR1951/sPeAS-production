name: PeAS immutable release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: peas-release
  cancel-in-progress: false

jobs:
  native-package:
    name: Build immutable Windows native package
    runs-on: windows-2025
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.13
      - name: Re-audit, check, test, and build the tagged native source
        shell: pwsh
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check:ui
          npm run check:deno
          npm run test:deno
          npm run build:ui
      - name: Package the tagged native release
        shell: pwsh
        run: ./scripts/New-PeasNativePackage.ps1 -ReleaseId '${{ github.ref_name }}' -OutputDirectory artifacts
      - name: Upload the native package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: peas-native-${{ github.ref_name }}
          path: |
            artifacts/peas-native-${{ github.ref_name }}.zip
            artifacts/peas-native-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require the tag to be on protected main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Re-audit the tagged dependency graph
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ github.sha }}
      - name: Build and publish the immutable image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=CC-BY-NC-4.0
          provenance: mode=max
          sbom: true
      - name: Publish build provenance attestation
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Print the digest to the release log
        run: |
          echo "Release: $GITHUB_REF_NAME"
          echo "Commit:  $GITHUB_SHA"
          echo "Digest:  ${{ steps.build.outputs.digest }}"
