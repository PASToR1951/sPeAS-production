<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User NavBar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- Base Styles --- */
        html, body {
            min-height: 100%;
            font-family: Inter;
            background-color: #f3f4f6; /* bg-gray-100 */
            overflow-x: hidden; /* Prevent horizontal scrollbar */
        }
        canvas { /* Confetti canvas styling */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
        }

        /* --- Theme Colors --- */
        :root {
            --theme-gold: #FDB813;
            --theme-gold-darker: #EAA10F;
            --theme-gold-light-bg: rgba(253, 184, 19, 0.2);
            --theme-gold-lighter-bg: rgba(253, 184, 19, 0.1);
            --theme-gold-highlight: rgba(253, 184, 19, 0.4);

            --theme-green-dark: #006A4E;
            --theme-green-darker-text: #00523D;
            --theme-green-light-bg: rgba(0, 106, 78, 0.3);
            --theme-green-lighter-bg: rgba(0, 106, 78, 0.15);
            --theme-green-border: rgba(0, 106, 78, 0.7);
            --theme-navbar-bg: #F9F6EE;
            --neutral-border-color: #e5e7eb;
            --input-border-color: #d1d5db;
            --placeholder-text-color: #9ca3af;

            --theme-blue-light-bg: rgba(59, 130, 246, 0.15);
            --theme-blue-border: rgba(59, 130, 246, 0.4);
            --theme-blue-text: #2563eb;

            --conveyor-bg-base-rgb: 248, 249, 247;

            /* Category Tile Colors */
            --category-tile-off-white-text: #E6E6E6;
            --category-tile-dark-text: #1f2937; /* Dark gray for lighter backgrounds */

            /* --- "All" Category Inactive State --- */
            --category-tile-all-muted-gradient: linear-gradient(105deg,
                rgba(239, 68, 68, 0.7),  /* Muted Red */
                rgba(234, 179, 8, 0.7),  /* Muted Yellow */
                rgba(59, 130, 246, 0.7), /* Muted Blue */
                rgba(0, 106, 78, 0.7)   /* Muted Green */
            );

            /* All - Inactive (Uses muted gradient) */
            --category-tile-all-bg-image: var(--category-tile-all-muted-gradient);
            --category-tile-all-text: #E6E6E6;
            --category-tile-all-count-bg: rgba(0, 0, 0, 0.25);
            --category-tile-all-count-text: #E6E6E6;
            --category-tile-all-border: rgba(0,0,0,0.1);

            /* All - Active (Original vibrant gradient) */
            --category-tile-all-active-gradient: linear-gradient(105deg,
                #ef4444 0%, /* Tailwind red-500 */
                #eab308 33%, /* Tailwind yellow-500 */
                #3b82f6 66%, /* Tailwind blue-500 */
                var(--theme-green-dark) 100%);
            --category-tile-all-active-text: #E6E6E6;
            --category-tile-all-active-count-bg: rgba(0, 0, 0, 0.3);
            --category-tile-all-active-count-text: #E6E6E6;
            --category-tile-all-active-border: var(--theme-gold);


            /* --- Thesis Tile (Red) --- */
            --category-tile-red-bg: #FEE2E2;
            --category-tile-red-text: #991B1B;
            --category-tile-red-count-bg: rgba(220, 38, 38, 0.15);
            --category-tile-red-count-text: #991B1B;
            --category-tile-red-border: #FECACA;

            /* Thesis (Red) - Active */
            --category-tile-red-active-bg: #DC2626;
            --category-tile-red-active-text: var(--category-tile-off-white-text);
            --category-tile-red-active-border: #B91C1C;
            --category-tile-red-active-count-bg: rgba(255, 255, 255, 0.25);
            --category-tile-red-active-count-text: var(--category-tile-off-white-text);

            /* --- Dissertation Tile (Green) --- */
            --category-tile-green-bg: #D1FAE5;
            --category-tile-green-text: #065F46;
            --category-tile-green-count-bg: rgba(0, 106, 78, 0.15);
            --category-tile-green-count-text: #065F46;
            --category-tile-green-border: #A7F3D0;

            /* Dissertation (Green) - Active */
            --category-tile-green-active-bg: var(--theme-green-dark);
            --category-tile-green-active-text: var(--category-tile-off-white-text);
            --category-tile-green-active-border: #064E3B;
            --category-tile-green-active-count-bg: rgba(255, 255, 255, 0.25);
            --category-tile-green-active-count-text: var(--category-tile-off-white-text);

            /* --- Confluence Tile (Yellow) --- */
            --category-tile-yellow-bg: #FEF9C3;
            --category-tile-yellow-text: #713F12;
            --category-tile-yellow-count-bg: rgba(234, 179, 8, 0.15);
            --category-tile-yellow-count-text: #713F12;
            --category-tile-yellow-border: #FEF08A;

            /* Confluence (Yellow) - Active */
            --category-tile-yellow-active-bg: #EAB308;
            --category-tile-yellow-active-text: var(--category-tile-dark-text);
            --category-tile-yellow-active-border: #CA8A04;
            --category-tile-yellow-active-count-bg: rgba(0,0,0,0.15);
            --category-tile-yellow-active-count-text: var(--category-tile-dark-text);

            /* --- Synergy Tile (Blue) --- */
            --category-tile-blue-bg: #DBEAFE;
            --category-tile-blue-text: #1E40AF;
            --category-tile-blue-count-bg: rgba(59, 130, 246, 0.15);
            --category-tile-blue-count-text: #1E40AF;
            --category-tile-blue-border: #BFDBFE;

            /* Synergy (Blue) - Active */
            --category-tile-blue-active-bg: #2563EB;
            --category-tile-blue-active-text: var(--category-tile-off-white-text);
            --category-tile-blue-active-border: #1D4ED8;
            --category-tile-blue-active-count-bg: rgba(255, 255, 255, 0.25);
            --category-tile-blue-active-count-text: var(--category-tile-off-white-text);

            /* --- Enhanced Active State Colors (Generic) --- */
            --category-active-box-shadow: inset 0 2px 6px rgba(0,0,0,0.25);
            --category-active-transform: translateY(1px) scale(0.97);
        }

        /* --- Keyframes for color shifting --- */
        @keyframes colorShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Navbar Styling --- */
        nav.sticky {
            background-color: var(--theme-navbar-bg) !important;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1) !important;
            border-bottom: 1px solid var(--neutral-border-color) !important;
        }
        .md\\:block .ml-10 a.nav-link-desktop,
        #mobile-menu a.nav-link-mobile,
        #mobile-menu button.nav-link-mobile {
            color: var(--theme-green-dark) !important;
            transition: color 0.2s ease, background-color 0.2s ease, transform 0.2s ease, font-weight 0.2s ease;
            position: relative; overflow: visible !important; padding-bottom: 5px;
        }
        .md\\:block .ml-10 a.nav-link-desktop:hover,
        #mobile-menu a.nav-link-mobile:hover,
        #mobile-menu button.nav-link-mobile:hover {
            background-color: var(--theme-gold-light-bg) !important;
            color: var(--theme-gold) !important;
            transform: translateY(-2px); font-weight: 600 !important;
        }
        .md\\:block .ml-10 a.nav-link-desktop::after,
        #mobile-menu a.nav-link-mobile::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background-color: var(--theme-gold); transform: scaleX(0);
            transform-origin: left; transition: transform 0.3s ease-out;
        }
        .md\\:block .ml-10 a.nav-link-desktop:hover::after,
        #mobile-menu a.nav-link-mobile:hover::after { transform: scaleX(1); }
        #mobile-menu button.nav-link-mobile::after { content: none !important; }
        #mobile-menu button.nav-link-mobile { padding-bottom: 0; }
        .flex-shrink-0 img.h-20 { transition: transform 0.3s ease, opacity 0.3s ease; }
        .flex-shrink-0 img.h-20:hover { transform: scale(1.08); opacity: 0.85; }
        #search-open-button {
            background-color: #FDFCF9; border: 1px solid var(--theme-green-light-bg);
            border-radius: 0.375rem; padding: 0.4rem 0.75rem; max-width: 300px;
            display: flex; align-items: center; text-align: left;
            font-size: 0.875rem; line-height: 1.25rem; color: var(--placeholder-text-color);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            -webkit-appearance: none; -moz-appearance: none; appearance: none; cursor: pointer;
        }
        #search-open-button:hover { background-color: var(--theme-navbar-bg); border-color: var(--theme-green-dark); }
        #search-open-button:focus {
            outline: none; border-color: var(--theme-gold) !important;
            box-shadow: 0 0 0 2px var(--theme-gold-lighter-bg) !important;
        }
        #search-open-button .search-bar-icon { color: var(--theme-green-dark); margin-right: 0.5rem; flex-shrink: 0; height: 1.25rem; width: 1.25rem; transition: color 0.2s ease; }
        #search-open-button:hover .search-bar-icon { color: var(--theme-gold); }
        #search-open-button .search-bar-placeholder-text { color: inherit; font-size: inherit; font-weight: normal; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kbd-shortcut {
            display: inline-flex; align-items: center; justify-content: center;
            font-family: Inter; background-color: #e5e7eb;
            color: #4b5563; border: 1px solid #9ca3af; border-bottom-width: 2px;
            border-radius: 0.25rem; padding: 0.1rem 0.35rem; font-size: 0.7em;
            font-weight: 600; line-height: 1; white-space: nowrap;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        #search-open-button-mobile .kbd-shortcut { background-color: var(--theme-green-dark); color: var(--theme-gold); border-color: var(--theme-gold-darker); }
        #search-open-button-mobile:hover .kbd-shortcut { background-color: var(--theme-green-darker-text) !important; color: #E6E6E6 !important; border-color: var(--theme-green-dark) !important; }
        #searchPlaceholderOverlay .kbd-shortcut { background-color: #f3f4f6; color: #6b7280; border-color: #d1d5db; font-size: 0.85em; font-weight: 500; padding: 0.05rem 0.25rem; margin: 0 0.1rem; border-bottom-width: 1px; }
        #profile-badge-button.bg-green-600 { background-color: var(--theme-gold) !important; transition: background-color 0.2s ease; }
        #profile-badge-button.hover\\:bg-green-700:hover { background-color: var(--theme-gold-darker) !important; }
        #profile-badge-button.focus\\:ring-green-600:focus { --tw-ring-color: var(--theme-gold) !important; }
        #mobile-menu .bg-green-600 { background-color: var(--theme-gold) !important; }
        .mobile-menu-button { color: var(--theme-green-dark) !important; background-color: transparent !important; transition: color 0.2s ease, background-color 0.2s ease; }
        .mobile-menu-button:hover { background-color: var(--theme-gold-light-bg) !important; color: var(--theme-gold) !important; }
        .mobile-menu-button.focus\\:ring-green-500:focus { --tw-ring-color: var(--theme-gold) !important; }
        .dropdown-menu { transition: opacity 0.2s ease-out, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-origin: top right; background-color: #E6E6E6; border: 1px solid var(--neutral-border-color); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); }
        .profile-initials { display: flex; align-items: center; justify-content: center; font-weight: 500; color: #E6E6E6; }
        .dropdown-divider { height: 1px; margin: 0.5rem 0; overflow: hidden; background-color: rgba(253, 184, 19, 0.25); }
        .dropdown-greeting-container { padding: 0.5rem 1rem; border-bottom: 1px solid rgba(253, 184, 19, 0.25); margin-bottom: 0.25rem; line-height: 1.4; }
        .greeting-text { color: #6b7280; font-size: 0.875rem; display: block; }
        .greeting-name { color: var(--theme-green-dark) !important; font-size: 0.875rem; font-weight: 500; display: block; word-break: break-word; overflow-wrap: break-word; white-space: normal; cursor: pointer; }
        .dropdown-menu a.group, .dropdown-menu button.group { display: flex; align-items: center; width: 100%; text-align: left; }
        .dropdown-menu a.group svg, .dropdown-menu button.group svg { margin-right: 0.75rem; width: 1.25rem; height: 1.25rem; color: #9ca3af; transition: color 0.15s ease-in-out; }
        .dropdown-menu a.group:hover svg, .dropdown-menu button.group:hover svg { color: var(--theme-green-dark); }
        .dropdown-menu a.text-gray-700.hover\\:bg-amber-100:hover, .dropdown-menu button.text-gray-700.hover\\:bg-amber-100:hover, .dropdown-menu a.group.text-gray-700.hover\\:bg-amber-100:hover, .dropdown-menu button.group.text-gray-700.hover\\:bg-amber-100:hover { background-color: var(--theme-gold-light-bg) !important; color: var(--theme-green-dark) !important; }
        .dropdown-menu a.group.text-gray-700.hover\\:bg-amber-100:hover svg, .dropdown-menu button.group.text-gray-700.hover\\:bg-amber-100:hover svg { color: var(--theme-green-dark) !important; }
        .dropdown-menu button.text-red-600.hover\\:bg-red-200:hover { background-color: rgba(220, 38, 38, 0.15) !important; color: #DC2626 !important; }
        .dropdown-menu button.group.text-red-600 svg { color: #f87171; }
        .dropdown-menu button.group.text-red-600.hover\\:bg-red-200:hover svg { color: #EF4444 !important; }
        .count-badge { margin-left: auto; padding: 0.125rem 0.5rem; border-radius: 9999px; background-color: var(--theme-gold-light-bg) !important; font-size: 0.75rem; font-weight: 500; color: var(--theme-green-dark) !important; transition: background-color 0.15s ease-in-out, color 0.15s ease-in-out; }
        .dropdown-menu a.group:hover .count-badge { background-color: var(--theme-green-dark) !important; color: #E6E6E6 !important; }
        #mobile-menu a.hover\\:bg-amber-100:hover, #mobile-menu button.hover\\:bg-amber-100:hover { background-color: var(--theme-gold-light-bg) !important; color: var(--theme-green-dark) !important; }
        #mobile-menu button.text-red-600:hover { background-color: rgba(220, 38, 38, 0.15) !important; color: #DC2626 !important; }
        #mobile-menu .bg-amber-100.text-green-800 { background-color: var(--theme-gold-light-bg) !important; color: var(--theme-green-dark) !important; }

        /* --- Search Overlay --- */
        #search-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            background-color: rgba(0, 40, 29, 0.65);
            z-index: 40; opacity: 0; transition: opacity 0.3s ease-in-out;
            pointer-events: none; display: flex; padding: 1rem;
            justify-content: center; align-items: flex-start; overflow-y: auto;
        }
        #search-overlay.visible { opacity: 1; pointer-events: auto; }
        #search-overlay::before, #search-overlay::after { content: ''; position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0; }
        #search-overlay::before { width: 45vw; height: 45vw; min-width: 280px; max-width: 450px; min-height: 280px; max-height: 450px; background: var(--theme-gold); top: 5%; left: 5%; animation: moveBlob1 20s infinite alternate ease-in-out; }
        #search-overlay::after { width: 55vw; height: 55vw; min-width: 320px; max-width: 550px; min-height: 320px; max-height: 550px; background: var(--theme-green-dark); bottom: 2%; right: 2%; animation: moveBlob2 24s infinite alternate ease-in-out 2.5s; }
        @keyframes moveBlob1 { 0% { transform: translate(-15%, -15%) scale(0.8); opacity: 0.25; } 25% { transform: translate(15%, -5%) scale(1.1); opacity: 0.4; } 50% { transform: translate(5%, 15%) scale(0.9); opacity: 0.3; } 75% { transform: translate(-10%, 5%) scale(1.2); opacity: 0.45; } 100% { transform: translate(-15%, -15%) scale(0.8); opacity: 0.25; } }
        @keyframes moveBlob2 { 0% { transform: translate(10%, 10%) scale(0.9); opacity: 0.3; } 25% { transform: translate(-5%, 15%) scale(0.7); opacity: 0.2; } 50% { transform: translate(-15%, -10%) scale(1.15); opacity: 0.4; } 75% { transform: translate(0%, -15%) scale(0.8); opacity: 0.25; } 100% { transform: translate(10%, 10%) scale(0.9); opacity: 0.3; } }
        .search-overlay-content {
            background-color: rgba(var(--conveyor-bg-base-rgb), 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            width: 100%; max-width: 48rem; margin-top: 2vh; margin-bottom: 2vh;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            border: 1px solid var(--neutral-border-color);
            transform: translateY(-20px);
            transition: transform 0.3s ease-in-out, background-color 0.3s ease, backdrop-filter 0.3s ease;
            position: relative; z-index: 1; max-height: 96vh;
            display: flex; flex-direction: column;
        }
        #search-overlay.visible .search-overlay-content { transform: translateY(0); }
        .search-input-wrapper-overlay { display: flex; align-items: center; padding: 1rem; border-bottom: 1px solid var(--neutral-border-color); flex-shrink: 0; position: relative; }
        .search-icon-overlay { width: 1.5rem; height: 1.5rem; color: var(--theme-green-dark); margin-right: 0.75rem; flex-shrink: 0; }
        #searchInputOverlay { width: 100%; font-size: 1rem; line-height: 1.5rem; color: var(--theme-green-darker-text); background-color: transparent; border: none; outline: none; padding-right: 7.5rem; }
        #searchInputOverlay::placeholder { color: #6c757d; opacity: 0.8; }
        #clearSearchInputButton { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background-color: transparent; color: var(--theme-green-dark); font-size: 0.875rem; font-weight: 500; padding: 0.25rem 0.5rem; border-radius: 0.375rem; border: 1px solid transparent; display: none; cursor: pointer; transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease; z-index: 20; white-space: nowrap; }
        #clearSearchInputButton:hover { color: var(--theme-gold-darker); background-color: var(--theme-gold-lighter-bg); border-color: var(--theme-gold); }
        #clearSearchInputButton.visible { display: inline-flex; align-items: center; }
        #loadingSpinnerOverlay { position: absolute; right: 4.5rem; top: 50%; transform: translateY(-50%); display: none; z-index: 10; }
        #loadingSpinnerOverlay.visible { display: inline-block; }
        #loadingSpinnerOverlay svg { animation: spin 1s linear infinite; height: 1.25rem; width: 1.25rem; color: var(--theme-green-dark); }
        .search-overlay-close-btn { position: absolute; top: 0.75rem; right: 0.75rem; padding: 0.5rem; border-radius: 9999px; background-color: rgba(255, 255, 255, 0.1); color: #e5e7eb; transition: background-color 0.2s, color 0.2s; z-index: 50; cursor: pointer; }
        .search-overlay-close-btn:hover { background-color: rgba(255, 255, 255, 0.25); color: #E6E6E6; }
        .search-overlay-close-btn svg { width: 1.25rem; height: 1.25rem; }

        /* --- Top Keywords Conveyor --- */
        .top-keywords-section { padding: 0.75rem 1rem; border-bottom: 1px solid var(--neutral-border-color); background-color: rgba(var(--conveyor-bg-base-rgb), 0.65); flex-shrink: 0; position: relative; }
        .top-keywords-label { font-size: 0.875rem; color: var(--theme-green-dark); margin-bottom: 0.5rem; font-weight: 500; display: block; }
        .keywords-conveyor-container { width: 100%; overflow-x: hidden; position: relative; height: auto; padding-top: 4px; padding-bottom: 12px; -webkit-overflow-scrolling: touch; }
        .keywords-conveyor-container::-webkit-scrollbar { display: none; }
        .keywords-conveyor-container { scrollbar-width: none; -ms-overflow-style: none; }
        .conveyor-scroll-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 36px; height: 36px; z-index: 3; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            opacity: 0; transition: opacity 0.3s ease-in-out, background-color 0.2s ease, border-color 0.2s ease, filter 0.2s ease;
            color: var(--theme-green-dark);
            background-color: rgba(var(--conveyor-bg-base-rgb), 0.5);
            backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
            border-radius: 50%; border: 1px solid transparent;
        }
        #conveyorScrollLeftBtn { left: 8px; }
        #conveyorScrollRightBtn { right: 8px; }
        .keywords-conveyor-container:hover .conveyor-scroll-btn { opacity: 0.7; }
        .conveyor-scroll-btn:hover {
            opacity: 1 !important; color: var(--theme-gold-darker);
            background-color: rgba(var(--conveyor-bg-base-rgb), 0.7);
            border-color: var(--theme-gold-light-bg);
            filter: drop-shadow(0px 2px 5px rgba(0, 0, 0, 0.3));
        }
        .conveyor-scroll-btn svg { width: 1.25rem; height: 1.25rem; }
        .keywords-conveyor-belt { display: flex; width: max-content; transition: transform 0.3s ease-in-out; cursor: grab; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;}
        .keywords-conveyor-belt.is-dragging { cursor: grabbing; }
        .keyword-conveyor-item {
            font-size: 0.875rem; color: var(--theme-green-dark);
            background-color: var(--theme-green-lighter-bg);
            padding: 0.35rem 0.85rem; margin-right: 0.6rem;
            border-radius: 16px; cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            border: 1px solid var(--theme-green-border); white-space: nowrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            filter: none; transform: scale(1); opacity: 1; z-index: 1;
            user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
        }

    function escapeHTMLAttr(str) {
        return String(str == null ? '' : str).replace(/[&<>"']/g, function(c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];

    function getPopularKeywordsForEmptyState(limit) {
        limit = limit || 6;
        try {
            var data = window.NavbarModule && window.NavbarModule.topKeywordsData && window.NavbarModule.topKeywordsData.top_keywords;
            if (Array.isArray(data) && data.length) {
                var seen = new Set(); var out = [];
                for (var i = 0; i < data.length && out.length < limit; i++) {
                    var raw = data[i];
                    var v = (raw && typeof raw === 'object') ? (raw.name || raw.keyword || raw.text || '') : raw;
                    var s = String(v == null ? '' : v).trim();
                    if (!s) continue;
                    var k = s.toLowerCase();
                    if (seen.has(k)) continue;
                    seen.add(k); out.push(s);
                }
                if (out.length) return out;
            }
        } catch (_) {}
        var belt = document.getElementById('keywordsConveyorBelt');
        if (belt) {
            var items = Array.from(belt.querySelectorAll('.keyword-conveyor-item'));
            var seen2 = new Set(); var out2 = [];
            for (var j = 0; j < items.length && out2.length < limit; j++) {
                var t = ((items[j].dataset && items[j].dataset.query) || items[j].textContent || '').trim();
                if (!t) continue;
                var lk = t.toLowerCase();
                if (seen2.has(lk)) continue;
                seen2.add(lk); out2.push(t);
            }
            return out2;
        }
        return [];

    // --- Fixed Predefined Categories ---

    const PREDEFINED_CATEGORIES = ["Thesis", "Dissertation", "Confluence", "Synergy"]; // ADD YOUR CATEGORIES HERE

    // Expose key constants and functions to window for navbar-loader.js to use
    if (typeof window !== 'undefined') {

    };

    // --- API Helper Function ---
    /**
     * Helper function to standardize fetch operations and handle errors
     */
    async function fetchData(url, options = {}) {
        try {
            // Check if NavbarModule already defined a fetch for this URL
            if (window.NavbarModule && window.NavbarModule.cachedResponses && window.NavbarModule.cachedResponses[url]) {
                                return window.NavbarModule.cachedResponses[url];
            }
            
            // Fetch data from server
                        const response = await fetch(url, options);
            if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`HTTP error! Status: ${response.status}. Body: ${errorBody}`);
            }
            
            // Parse response
            const contentType = response.headers.get("content-type");
            let data;
            if (contentType && contentType.includes("application/json")) {
                data = await response.json();
            } else {
                data = await response.text();
            }
            
            // Cache the response if NavbarModule exists
            if (window.NavbarModule) {
                if (!window.NavbarModule.cachedResponses) {
                    window.NavbarModule.cachedResponses = {};
                }
                window.NavbarModule.cachedResponses[url] = data;
            }
            
            return data;
        } catch (error) {
            throw error;
        }
    }

    // --- Backend API Functions ---

    // API Endpoints
    const API = {
        documents: '/api/documents',
        categories: '/api/categories',
        keywords: '/api/keywords',
        researchAgenda: '/api/research-agenda',
        trendingKeywords: '/api/trending-keywords'
    };

    /**
     * Fetches public filter data without preloading an author directory.
     */
    async function fetchFiltersData() {
        try {
            // Fetch initial data to populate filters
            const [categoryResponse, keywordResponse, documentResponse] = await Promise.all([
                fetchData(API.categories),
                fetchData(API.keywords),
                fetchData(`${API.documents}?limit=100`) // Get documents to extract years and counts
            ]);
            
            // Public author discovery is query-driven through
            // /api/authors/search; the complete filter directory is private.
            const authors = [];
            
            // Process keywords
            const keywords = keywordResponse || [];
            
            // Process categories and count documents by type
            const categoryCounts = {};
            PREDEFINED_CATEGORIES.forEach(category => {
                categoryCounts[category] = 0; // Initialize with zeros
            });
            
            // Extract years and count documents by type
            const years = new Set();
            let totalDocuments = 0;
            
            if (documentResponse && documentResponse.documents) {
                documentResponse.documents.forEach(doc => {
                    // Count by document type
                    if (doc.document_type) {
                        const docType = doc.document_type.charAt(0).toUpperCase() + doc.document_type.slice(1).toLowerCase();
                        if (categoryCounts[docType] !== undefined) {
                            categoryCounts[docType]++;
                            totalDocuments++;
                        }
                    }
                    
                    // Extract year from publication_date
                    if (doc.publication_date) {
                        try {
                            const year = new Date(doc.publication_date).getFullYear();
                            if (!isNaN(year)) {
                                years.add(year.toString());
                            }
                        } catch (e) {
                        }
                    }
                });
            }
            
            // Sort years numerically in descending order
            const yearsArray = Array.from(years).sort((a, b) => parseInt(b) - parseInt(a));
            
            console.log("Search filters loaded:", {
                authors, keywords, years: yearsArray, categoryCounts, totalDocuments
            });
            
            return {
                authors,
                keywords,
                years: yearsArray,
                categoryCounts,
                totalDocuments
            };
        } catch (error) {
            // If API fails, use predefined categories with default counts
            const defaultCounts = {};
            PREDEFINED_CATEGORIES.forEach(cat => defaultCounts[cat] = 0);
            return { 
                authors: [], 
                keywords: [], 
                years: [], 
                categoryCounts: defaultCounts, 
                totalDocuments: 0 
            };
        }
    }
    
    async function fetchTopKeywords() {
        try {
            // First try trending keywords endpoint
            try {
                const data = await fetchData(API.trendingKeywords);
                                
                if (data && data.keywords && data.keywords.length > 0) {
                    return { top_keywords: data.keywords };
                }
            } catch (trendingErr) {
                            }
            
            // Fallback to regular keywords
            const keywords = await fetchData(API.keywords);
                        return { top_keywords: keywords || [] };
        } catch (error) {
            return { top_keywords: [] };
        }
    }
    
    async function performSearch(searchQuery, filters) {
        try {
            const url = new URL(API.documents, window.location.origin);
            
            // Add search parameter
            if (searchQuery) url.searchParams.append('search', searchQuery);
            
            // Store selected categories for client-side filtering
            const selectedCategories = filters.category && filters.category.length > 0 
                ? filters.category.map(cat => cat.toUpperCase()) 
                : [];
                
                        
            // For backward compatibility, just fetch all documents without category filter
            // if multiple categories are selected - we'll filter on client side
            if (selectedCategories.length === 1) {
                // Apply single category filter directly - this should work with existing API
                url.searchParams.append('category', selectedCategories[0]);
                // Also try document_type as an alternative parameter name
                url.searchParams.append('document_type', selectedCategories[0]);
            } else if (selectedCategories.length > 1) {
                // For multiple categories, we'll fetch more documents and filter client-side
                // The limit needs to be higher to ensure we get enough results after filtering
                url.searchParams.set('limit', '50');
            }
            
            // Add other filters
            if (filters.author) url.searchParams.append('author', filters.author);
            if (filters.keywords) url.searchParams.append('keyword', filters.keywords);
            if (filters.year) url.searchParams.append('year', filters.year);
            
            // Add pagination (increase limit if multiple categories to ensure enough results after filtering)
            if (!selectedCategories.length || selectedCategories.length <= 1) {
                url.searchParams.append('limit', '10');
            }
            url.searchParams.append('page', '1');
            
                        
            // Fetch documents
            const documentData = await fetchData(url.toString());
            let documents = documentData?.documents || [];
            
            // Apply client-side filtering for multiple categories if needed
            if (selectedCategories.length > 1 && documents.length > 0) {
                documents = documents.filter(doc => {
                    // Get document's category/type and normalize for comparison
                    const documentType = doc.document_type || doc.category || '';
                    const normalizedType = documentType.toUpperCase();
                    
                    // Keep document if its type matches any of our selected categories
                    return selectedCategories.includes(normalizedType);
                });
                
                            }
            
            // Process documents to add correct URLs and normalize metadata
            documents = documents.map(doc => {
                // Determine if this is a compiled document
                const isCompiled = doc.is_compiled === true || 
                                   doc.document_type?.toLowerCase() === 'compiled' || 
                                   doc.child_count > 0;
                
                // For user navbar, direct to the appropriate page
                const documentUrl = isCompiled 
                    ? `/pages/user-compiled.html?id=${doc.id}` 
                    : `/pages/user-single.html?id=${doc.id}`;
                
                // Normalize metadata fields for consistent rendering
                let normalizedKeywords = [];
                
                // Process keywords into a consistent format
                if (doc.keywords) {
                    if (Array.isArray(doc.keywords)) {
                        normalizedKeywords = doc.keywords;
                    } else if (typeof doc.keywords === 'string') {
                        normalizedKeywords = doc.keywords.split(',').map(k => k.trim()).filter(k => k);
                    }
                } else if (doc.tags && Array.isArray(doc.tags)) {
                    normalizedKeywords = doc.tags;
                }
                
                // Ensure publication date is preserved
                // This will be formatted by the renderer function
                const publicationDate = doc.publication_date || null;
                
                // Log document metadata for debugging
                                
                // Return enriched document object
                return {
                    ...doc,
                    url: documentUrl,
                    keywords: normalizedKeywords,
                    // Ensure these fields exist even if empty
                    author_name: doc.author_name || doc.author || doc.creator || '',
                    publication_date: publicationDate
                };
            });
            
            // Fetch matching authors if we have a search query
            let authorHits = [];
            if (searchQuery) {
                try {
                    const authorUrl = new URL('/api/authors/search', window.location.origin);
                    authorUrl.searchParams.append('q', searchQuery);
                    
                    const authorResults = await fetchData(authorUrl.toString());
                    
                    // Map authors to the expected format
                    authorHits = (Array.isArray(authorResults) ? authorResults : [])
                        .map(author => ({
                            title: author.full_name,
                            name: author.full_name,
                            document_count: author.worksCount || 0,
                            articleCount: author.worksCount || 0,
                            department: author.department || '',
                            url: `/pages/authorprofile.html?id=${author.id}`
                        }));
                } catch (authorErr) {
                }
            }
            
            // Look for matching keywords if we have a search query
            let keywordHits = [];
            if (searchQuery) {
                try {
                    const allKeywords = await fetchData(API.keywords);
                    
                    // Filter keywords by search term
                    if (Array.isArray(allKeywords)) {
                        const lowerQuery = searchQuery.toLowerCase();
                        keywordHits = allKeywords
                            .filter(kw => kw.toLowerCase().includes(lowerQuery))
                            .map(keyword => ({
                                name: keyword,
                                keyword: keyword,
                                title: keyword,
                                relatedArticleCount: 1,
                                document_count: 1
                            }));
                    }
                } catch (kwErr) {
                }
            }
            
            // Return unified search results
            return {
                query: searchQuery,
                results: {
                    documents: {
                        label: "Documents",
                        hits: documents,
                        count: documents.length
                    },
                    authors: {
                        label: "Authors",
                        hits: authorHits,
                        count: authorHits.length
                    },
                    keywords: {
                        label: "Matching Keywords",
                        hits: keywordHits,
                        count: keywordHits.length
                    }
                }
            };
        } catch (error) {
            return {
                query: searchQuery,
                results: {
                    documents: { label: "Documents", hits: [], count: 0 },
                    authors: { label: "Authors", hits: [], count: 0 },
                    keywords: { label: "Matching Keywords", hits: [], count: 0 }
                }
            };
        }
    }
    
    async function checkAuthStatus() {
        try {
            const userInfo = JSON.parse(sessionStorage.getItem('userInfo'));
            if (userInfo && userInfo.isLoggedIn) {
                // Auth rides the HttpOnly session cookie automatically
                const response = await fetch('/api/auth/get-session', {
                    credentials: 'include',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) {
                    return {isAuthenticated: false, user: null};
                }

                const data = await response.json();
                if (!data || !data.user) {
                    return {isAuthenticated: false, user: null};
                }
                return {isAuthenticated: true, user: data.user};
            }
            return {isAuthenticated: false, user: null};
        } catch (error) {
            return {isAuthenticated: false, user: null};
        }
    }

    function highlightText(text, query) {
        if (!query || typeof text !== 'string') return text || '';
        const escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const regex = new RegExp(`(${escapedQuery})`, 'gi');
        return text.replace(regex, `<span class="${HIGHLIGHT_CLASS}">$1</span>`);
    }
    let debounceTimerOverlay;
    function debounceOverlay(func, delay) {
        return function(...args) {
            clearTimeout(debounceTimerOverlay);
            debounceTimerOverlay = setTimeout(() => func.apply(this, args), delay);
        };
    }
    function populateSelectWithOptions(selectElement, optionsArray, placeholder = "All") {
        if (!selectElement) return;
        const currentVal = selectElement.value;
        while (selectElement.options.length > 1) {
            selectElement.remove(1);
        }
        if (Array.isArray(optionsArray)) {
            optionsArray.forEach(item => {
                const option = document.createElement('option');
                if (typeof item === 'object' && item.value && item.text) {
                    option.value = item.value;
                    option.textContent = item.text;
                } else {
                    option.value = item;
                    option.textContent = item;
                }
                selectElement.appendChild(option);
            });
        }
        if (currentVal && Array.from(selectElement.options).some(opt => opt.value === currentVal)) {
            selectElement.value = currentVal;
        } else {
            selectElement.value = "";
        }
    }

    function handleCategoryButtonClick(event) {
        const clickedButton = event.target.closest(`.${CATEGORY_FILTER_BUTTON_CLASS}`);
        if (!categoryButtonsContainerOverlay || !clickedButton) return;

        const isAllButton = clickedButton.getAttribute(DATA_CATEGORY_ATTR) === '';
        const allCategoryButton = categoryButtonsContainerOverlay.querySelector(`.${CATEGORY_FILTER_BUTTON_CLASS}[${DATA_CATEGORY_ATTR}=""]`);
        const specificCategoryButtons = Array.from(categoryButtonsContainerOverlay.querySelectorAll(`.${CATEGORY_FILTER_BUTTON_CLASS}:not([${DATA_CATEGORY_ATTR}=""])`));

        if (isAllButton) {
            // If "All" button was clicked and isn't already active
            if (!clickedButton.classList.contains(ACTIVE_CLASS)) {
                // Deactivate all specific category buttons
                specificCategoryButtons.forEach(btn => btn.classList.remove(ACTIVE_CLASS));
                // Activate "All" button
                clickedButton.classList.add(ACTIVE_CLASS);
                
                // Add a visual indicator showing it's the "All" filter
                clickedButton.setAttribute('title', 'All Categories');
            }
        } else {
            // If a specific category was clicked, toggle its active state
            clickedButton.classList.toggle(ACTIVE_CLASS);
            
            // Check if any specific category is now active
            const activeSpecificButtons = specificCategoryButtons.filter(btn => btn.classList.contains(ACTIVE_CLASS));
            const anySpecificActive = activeSpecificButtons.length > 0;
            
            // Update tooltips to show multi-selection state
            if (clickedButton.classList.contains(ACTIVE_CLASS)) {
                clickedButton.setAttribute('title', 'Selected - Click to deselect');
            } else {
                clickedButton.setAttribute('title', 'Click to select');
            }
            
            // Show count of active filters if multiple are selected
            if (activeSpecificButtons.length > 1) {
                const activeCategories = activeSpecificButtons.map(btn => btn.getAttribute(DATA_CATEGORY_ATTR));
                                
                // Update tooltips with additional info about multiple selection
                activeSpecificButtons.forEach(btn => {
                    btn.setAttribute('title', `Selected - Click to deselect (${activeSpecificButtons.length} categories selected)`);
                });
            }

            if (allCategoryButton) {
                // If any specific category is active, deactivate "All" button
                if (anySpecificActive) {
                    allCategoryButton.classList.remove(ACTIVE_CLASS);
                    allCategoryButton.setAttribute('title', 'Click to clear filters and show all categories');
                } else {
                    // If no specific categories are active, reactivate "All" button
                    allCategoryButton.classList.add(ACTIVE_CLASS);
                    allCategoryButton.setAttribute('title', 'All Categories');
                }
            }
        }
        performSearchOverlay();
    }
    async function initializeFiltersAndTopKeywords() {
        try {
            // Fetch and cache all necessary data
            const [filtersData, topKeywordsData] = await Promise.all([
                fetchFiltersData(),
                fetchTopKeywords()
            ]);
            
            // Store in navbar module if available
            if (window.NavbarModule) {
                window.NavbarModule.filtersData = filtersData;
                window.NavbarModule.topKeywords = topKeywordsData;
                window.NavbarModule.filtersLoaded = true;
            }
            
            // Apply filters data to UI
            if (filtersData) {
                // Populate select dropdowns
            if (filtersData.authors) populateSelectWithOptions(authorFilterOverlay, filtersData.authors);
            if (filtersData.keywords) populateSelectWithOptions(keywordsFilterOverlay, filtersData.keywords);
            if (filtersData.years) populateSelectWithOptions(yearFilterOverlay, filtersData.years);

                // Populate category buttons with real counts
                if (filtersData.categoryCounts) {
                    populateCategoryButtons(
                        PREDEFINED_CATEGORIES,
                        filtersData.categoryCounts,
                        filtersData.totalDocuments
                    );
                    
                    // Re-attach direct handlers to category buttons
                    if (categoryButtonsContainerOverlay) {
                        const buttons = categoryButtonsContainerOverlay.querySelectorAll(`.${CATEGORY_FILTER_BUTTON_CLASS}`);
                        buttons.forEach(button => {
                            // Remove old handlers
                            const newButton = button.cloneNode(true);
                            button.parentNode.replaceChild(newButton, button);
                            
                            // Add new handlers
                            newButton.addEventListener('click', function(e) {
                                                                handleCategoryButtonClick(e);
                            });
                        });
                    }
                }
            }
            
            // Apply top keywords to conveyor
            if (topKeywordsData && topKeywordsData.top_keywords && topKeywordsData.top_keywords.length > 0 && keywordsConveyorBelt) {
                updateKeywordsConveyor(topKeywordsData.top_keywords);
            } else if (keywordsConveyorBelt) {
                // Use a fallback if API returns no data
                const fallbackKeywords = ["Research", "Academic", "Publication", "Journal", "Study"];
                updateKeywordsConveyor(fallbackKeywords);
            }
            
                        return true;
        } catch (error) {
            // Use fallbacks if API fails
            // Fallback for top keywords
            if (keywordsConveyorBelt) {
                const fallbackKeywords = ["Research", "Academic", "Publication", "Journal", "Study"];
                updateKeywordsConveyor(fallbackKeywords);
            }
            
            // Fallback for category buttons
            if (categoryButtonsContainerOverlay) {
                const emptyCounts = {};
                PREDEFINED_CATEGORIES.forEach(cat => emptyCounts[cat] = 0);
                populateCategoryButtons(PREDEFINED_CATEGORIES, emptyCounts, 0);
            }
            
            if (topKeywordsSection) { 
                const label = topKeywordsSection.querySelector('.top-keywords-label'); 
                if (label) { 
                    label.textContent = 'Top Keywords'; 
                    const errorSpan = document.createElement('span'); 
                    errorSpan.className = 'text-sm text-gray-500 ml-2'; 
                    errorSpan.textContent = '(Using fallback data)'; 
                    label.insertAdjacentElement('afterend', errorSpan); 
                }
            }
            
            return false;
        }
    }
    function getActiveCategories() {
        const activeCategories = [];
        if (categoryButtonsContainerOverlay) {
            const allCatButton = categoryButtonsContainerOverlay.querySelector(`.${CATEGORY_FILTER_BUTTON_CLASS}[${DATA_CATEGORY_ATTR}=""]`);
            if (!allCatButton || !allCatButton.classList.contains(ACTIVE_CLASS)) { // Only add specific categories if "All" is NOT active
                categoryButtonsContainerOverlay.querySelectorAll(`.${CATEGORY_FILTER_BUTTON_CLASS}.${ACTIVE_CLASS}:not([${DATA_CATEGORY_ATTR}=""])`)
                    .forEach(button => {
                        const categoryValue = button.getAttribute(DATA_CATEGORY_ATTR);
                        if (categoryValue) {
                            activeCategories.push(categoryValue);
                        }
                    });
            }
        }
        return activeCategories;
    }
    async function performSearchOverlay() {
        if (!searchResultsOverlay || !searchInputOverlay || !loadingSpinnerOverlay ) {
            return;
        }
        
        const query = searchInputOverlay.value.trim();
        const selectedCategories = getActiveCategories();
        const selectedAuthor = authorFilterOverlay.value;
        const selectedKeywordsFilter = keywordsFilterOverlay.value;
        const selectedYear = yearFilterOverlay.value;
        
        const hasQuery = !!query;
        const hasSpecificCategoryFilter = selectedCategories.length > 0; // True if any specific category is selected
        const isAllCategoryActive = categoryButtonsContainerOverlay?.querySelector(`.${CATEGORY_FILTER_BUTTON_CLASS}[${DATA_CATEGORY_ATTR}=""].${ACTIVE_CLASS}`) !== null;
        const hasFilters = hasSpecificCategoryFilter || !!selectedAuthor || !!selectedKeywordsFilter || !!selectedYear || (!isAllCategoryActive && selectedCategories.length === 0); // Consider it filtered if "All" is not active and no specific are active (edge case, means nothing selected)

        let placeholderEl = document.getElementById('searchPlaceholderOverlay');

        if (!hasQuery && !hasFilters && isAllCategoryActive) { // Show placeholder only if no query, no specific filters, AND "All" is active
            searchResultsOverlay.innerHTML = getEmptyStateHTML();
            showAllResultsContainer.classList.add(HIDDEN_CLASS);
            loadingSpinnerOverlay.classList.remove(VISIBLE_CLASS);
            if (clearSearchInputButton) clearSearchInputButton.classList.remove(VISIBLE_CLASS);
            updateShowAllResultsState();
            return;
        }

        if(placeholderEl) placeholderEl.classList.add(HIDDEN_CLASS);
        loadingSpinnerOverlay.classList.add(VISIBLE_CLASS);
        searchResultsOverlay.innerHTML = '<p class="search-no-results">Searching...</p>';
        showAllResultsContainer.classList.add(HIDDEN_CLASS);
        
        try {
            const filtersToApply = { 
                category: selectedCategories, 
                author: selectedAuthor, 
                keywords: selectedKeywordsFilter, 
                year: selectedYear 
            };
            
            const apiResponse = await performSearch(query, filtersToApply);
            displaySearchResultsOverlay(apiResponse, query);
        } catch (error) {
            searchResultsOverlay.innerHTML = `<p class="search-no-results">Error fetching search results.</p>`;
            showAllResultsContainer.classList.add(HIDDEN_CLASS);
        } finally {
            loadingSpinnerOverlay.classList.remove(VISIBLE_CLASS);
        }
    }
    function createDocumentResultHTML(item, queryToHighlight) {
        const titleHighlighted = highlightText(item.title, queryToHighlight);
        const descHighlighted = item.abstract ? highlightText(item.abstract, queryToHighlight) : 
                           (item.description ? highlightText(item.description, queryToHighlight) : '');
        
        // Get document category/type for display
        let documentCategory = '';
        if (item.document_type) {
            documentCategory = item.document_type.charAt(0).toUpperCase() + item.document_type.slice(1).toLowerCase();
        } else if (item.category) {
            documentCategory = item.category.charAt(0).toUpperCase() + item.category.slice(1).toLowerCase();
        }

        // Create CSS class for the category tag based on document type
        let categoryTagClass = 'search-result-category-tag';
        if (documentCategory.toLowerCase() === 'thesis') {
            categoryTagClass += ' bg-red-100 text-red-800 border border-red-200';
        } else if (documentCategory.toLowerCase() === 'dissertation') {
            categoryTagClass += ' bg-green-100 text-green-800 border border-green-200';
        } else if (documentCategory.toLowerCase() === 'confluence') {
            categoryTagClass += ' bg-yellow-100 text-yellow-800 border border-yellow-200';
        } else if (documentCategory.toLowerCase() === 'synergy') {
            categoryTagClass += ' bg-blue-100 text-blue-800 border border-blue-200';
        }
        
        // Enhanced keyword handling
        let keywordsHTML = '';
        if (item.keywords) {
            if (Array.isArray(item.keywords) && item.keywords.length > 0) {
                keywordsHTML = item.keywords.map(kw => {
                    if (typeof kw === 'string') {
                        return `<span class="keyword-pill">${kw}</span>`;
                    } else if (typeof kw === 'object') {
                        return `<span class="keyword-pill">${kw.name || kw.keyword || kw.text || ''}</span>`;
                    }
                    return '';
                }).filter(html => html.length > 0).join('');
            } else if (typeof item.keywords === 'string' && item.keywords.trim().length > 0) {
                keywordsHTML = item.keywords.split(',')
                    .map(kw => kw.trim())
                    .filter(kw => kw)
                    .map(kw => `<span class="keyword-pill">${kw}</span>`)
                    .join('');
            }
        } else if (item.tags && Array.isArray(item.tags) && item.tags.length > 0) {
            // Try 'tags' as an alternative field name
            keywordsHTML = item.tags.map(tag => `<span class="keyword-pill">${tag}</span>`).join('');
        }
        
        // Get author information with various field name fallbacks
        const authorName = item.author_name || item.author || item.creator || '';
        
        // Get publication date with formatting
        let formattedDate = '';
        if (item.publication_date) {
            try {
                // Format the date as a readable string (e.g., "January 15, 2023")
                const date = new Date(item.publication_date);
                if (!isNaN(date.getTime())) {
                    formattedDate = date.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                }
            } catch (e) {
                formattedDate = item.publication_date; // Use as-is if parsing fails
            }
        }
        
        // Fallback to year if no full date is available
        const displayDate = formattedDate || item.publication_year || item.year || '';
        
        return `
            <div class="search-result-title">${titleHighlighted || 'No Title'}</div>
            <div class="search-result-meta-primary">
                ${authorName ? `<span class="search-result-author">By: ${authorName}</span>` : ''}
                ${displayDate ? `<span class="search-result-date">${displayDate}</span>` : ''}
            </div>
            <div class="search-result-category-keywords">
                ${documentCategory ? `<span class="${categoryTagClass}">${documentCategory}</span>` : ''}
                ${keywordsHTML ? `<div class="search-result-keywords-container">${keywordsHTML}</div>` : ''}
            </div>
            <!-- Description removed as requested -->
            `;
    }

    async function checkAuthStatusAndSetupUI() { 
        try { 
            // Check if we're loaded via navbar-loader.js
            const isLoadedViaNavbarLoader = window.NavbarModule && window.NavbarModule.userInfo;

            // Get user info either from NavbarModule or call the API
            let authData;
            if (isLoadedViaNavbarLoader) {
                                authData = {
                    isAuthenticated: window.NavbarModule.userInfo.isLoggedIn,
                    user: window.NavbarModule.userInfo
                };
                currentUser = authData.user; 
            } else { 
                // Directly access sessionStorage as fallback (for standalone usage)
                try {
                    const userInfoStr = sessionStorage.getItem('userInfo');
                                                            
                    if (userInfoStr) {
                        const userInfo = JSON.parse(userInfoStr);
                        if (userInfo && userInfo.isLoggedIn) {
                                                        authData = {
                                isAuthenticated: true,
                                user: userInfo
                            };
                            currentUser = userInfo;
                        } else {
                            authData = { isAuthenticated: false, user: null };
                            currentUser = null;
                        }
                    } else {
                        // Try API as last resort
                                                const apiUrl = '/api/v1/auth/status';
                        
                        try {
                            const data = await fetchData(apiUrl);
                            if (data && data.isAuthenticated && data.user) {
                                authData = data;
                                currentUser = data.user;
                            } else {
                                authData = { isAuthenticated: false, user: null };
                                currentUser = null;
                            }
                        } catch (apiErr) {
                            authData = { isAuthenticated: false, user: null };
                            currentUser = null;
                        }
                    }
                } catch (storageErr) {
                    authData = { isAuthenticated: false, user: null };
                    currentUser = null;
                }
            }

            // Update UI based on authentication status
            if (authData.isAuthenticated && authData.user) {
                // Format user data
                const formattedUser = formatUserData(authData.user);
                
                // Update the UI
                updateUIForAuthenticatedUser(formattedUser);
                
                // If loaded via navbar-loader, also expose the formatted user
                if (window.NavbarModule) {
                    window.NavbarModule.formattedUser = formattedUser;
                }
            } else {
                // Redirect to login if loaded directly (not via navbar-loader)
                if (!isLoadedViaNavbarLoader) {
                    window.location.href = '/log-in.html';
                }
            } 
        } catch (error) { 
            // If loaded directly, redirect to login
            if (!(window.NavbarModule && window.NavbarModule.userInfo)) {
                window.location.href = '/log-in.html';
            }
        }
    }
    
    function formatUserData(user) {
        // Helper to generate initials from user data
        const getInitials = (user) => {
            if (user.first_name && user.last_name) {
                return user.first_name.charAt(0) + user.last_name.charAt(0);
            } else if (user.first_name) {
                return user.first_name.charAt(0) + (user.middle_name ? user.middle_name.charAt(0) : '');
            } else if (user.display_name || user.username) {
                const name = user.display_name || user.username;
                const parts = name.split(' ');
                if (parts.length > 1) {
                    return parts[0].charAt(0) + parts[parts.length - 1].charAt(0);
                } else {
                    return name.substring(0, 2);
                }
            } else {
                return '??';
            }
        };

        else if (user.profilePictureUrl) profilePic = user.profilePictureUrl;
        
        if (profilePic) {
                    }

        // Create formatted user object
        return {
            id: user.id || user.username || 'unknown',
            name: user.display_name || user.first_name && user.last_name ? `${user.first_name} ${user.last_name}` : user.username || 'User',

    function updateKeywordsConveyor(keywordsToDisplay) {
                if (!keywordsConveyorBelt || !Array.isArray(keywordsToDisplay)) {
            return;
        }

        // Dedupe case-insensitively while preserving first occurrence's casing.
        const seen = new Map();
        keywordsToDisplay.forEach(term => {
            const value = (term && typeof term === 'object') ? (term.name || term.keyword || term.text || '') : term;
            const str = String(value == null ? '' : value).trim();
            if (!str) return;
            const key = str.toLowerCase();
            if (!seen.has(key)) seen.set(key, str);
        });
        keywordsToDisplay = Array.from(seen.values());

        // Clear existing content
        keywordsConveyorBelt.innerHTML = '';

        // If no keywords, add some placeholders
        if (keywordsToDisplay.length === 0) {
                        keywordsToDisplay = ["Thesis", "Research", "Academic", "Journal", "Paper", "University", "Education", "Literature", "Theory", "Analysis"];
        }
        firstSetItemCount = keywordsToDisplay.length;

        const selectKeywordTerm = (term) => {
            if (searchInputOverlay && term) {
                searchInputOverlay.value = term;
                if (clearSearchInputButton) {
                    clearSearchInputButton.classList.add(VISIBLE_CLASS);
                }
                performSearchOverlay();
                searchInputOverlay.focus();
            }
        };
        
        const createKeywordItem = (term) => {
            const li = document.createElement('li');
            li.className = 'keyword-conveyor-item';
            li.dataset.query = term;
            li.textContent = term;
            li.setAttribute('role', 'button');
            li.tabIndex = 0;
            
            // Add click handler directly to each keyword
            li.addEventListener('click', function() {
                selectKeywordTerm(this.dataset.query);
            });
            li.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    selectKeywordTerm(this.dataset.query);
                }
            });
            
            return li;
        };
        
        // Add keyword chips once; wrapping CSS keeps long terms visible.
        keywordsToDisplay.forEach(term => { 
            keywordsConveyorBelt.appendChild(createKeywordItem(term)); 
        });

        currentTranslateX = 0;
        itemWidthWithMargin = 0;

                    populateSelectWithOptions(keywordsFilterOverlay, window.NavbarModule.keywordData || []);
                }
                
                // Try to get years from navbar-loader's cache
                if (window.NavbarModule.yearData && yearFilterOverlay) {
                    populateSelectWithOptions(yearFilterOverlay, window.NavbarModule.yearData || []);
                }
                
                // Try to get top keywords from navbar-loader's cache
                if (window.NavbarModule.topKeywordsData && keywordsConveyorBelt) {
                    updateKeywordsConveyor(window.NavbarModule.topKeywordsData.top_keywords || []);
                }
                
                return;
            }
            
            // Load both filters and top keywords in parallel
                        let filtersAndCountsData, topKeywordsData;
            
            try {
                [filtersAndCountsData, topKeywordsData] = await Promise.all([
                    fetchFiltersData(),
                    fetchTopKeywords()
                ]);
            } catch (error) {
                filtersAndCountsData = { categoryCounts: {}, authors: [], keywords: [], years: [], totalDocuments: 0 };
                topKeywordsData = { top_keywords: [] };
            }
            
                                    
            // Populate category buttons
            if (PREDEFINED_CATEGORIES.length > 0 && filtersAndCountsData.categoryCounts) {
                populateCategoryButtons(
                    PREDEFINED_CATEGORIES, 
                    filtersAndCountsData.categoryCounts, 
                    filtersAndCountsData.totalDocuments || 0
                );
                
                // Cache in NavbarModule if available
                if (window.NavbarModule) {
                    window.NavbarModule.categoryData = {
                        categoryCounts: filtersAndCountsData.categoryCounts,
                        totalDocuments: filtersAndCountsData.totalDocuments || 0
                    };
                }
            }
            
            // Populate filter dropdowns
            if (filtersAndCountsData.authors && authorFilterOverlay) {
                populateSelectWithOptions(authorFilterOverlay, filtersAndCountsData.authors);
                
                // Cache in NavbarModule if available
                if (window.NavbarModule) {
                    window.NavbarModule.authorData = filtersAndCountsData.authors;
                }
            }
            
            if (filtersAndCountsData.keywords && keywordsFilterOverlay) {
                populateSelectWithOptions(keywordsFilterOverlay, filtersAndCountsData.keywords);
                
                // Cache in NavbarModule if available
                if (window.NavbarModule) {
                    window.NavbarModule.keywordData = filtersAndCountsData.keywords;
                }
            }
            
            if (filtersAndCountsData.years && yearFilterOverlay) {
                populateSelectWithOptions(yearFilterOverlay, filtersAndCountsData.years);
                
                // Cache in NavbarModule if available
                if (window.NavbarModule) {
                    window.NavbarModule.yearData = filtersAndCountsData.years;
                }
            }
            
            // Populate top keywords conveyor
            if (topKeywordsData.top_keywords && keywordsConveyorBelt) {
                updateKeywordsConveyor(topKeywordsData.top_keywords);
                
                // Cache in NavbarModule if available
                if (window.NavbarModule) {
                    window.NavbarModule.topKeywordsData = topKeywordsData;
                }
            }
            
            // Mark as loaded in NavbarModule if available
            if (window.NavbarModule) {
                window.NavbarModule.filtersLoaded = true;
            }
        } catch (error) {
        } finally {
            if (loadingSpinnerOverlay) {
                loadingSpinnerOverlay.classList.remove(VISIBLE_CLASS);
            }
        }
    }
})(); // IIFE End

// Ensure Show All Results button works
window.addEventListener('DOMContentLoaded', function() {
    var showAllResultsBtn = document.getElementById('showAllResultsBtn');
    if (showAllResultsBtn) {
        showAllResultsBtn.addEventListener('click', function() {
            var searchInputValue = document.getElementById('searchInputOverlay').value || '';
            window.location.href = '/pages/searchResultsPage.html?q=' + encodeURIComponent(searchInputValue);
        }, true); // Using capture phase to ensure this handler runs first
    }
});
</script>
