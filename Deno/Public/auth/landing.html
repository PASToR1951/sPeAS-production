<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing you in… - sPeAS</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f5f7f6;
      color: #1f2d27;
    }
    .landing {
      text-align: center;
    }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 16px;
      border: 4px solid #d7e3dc;
      border-top-color: #046937;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="landing">
    <div class="spinner" aria-hidden="true"></div>
    <p>Signing you in…</p>
  </div>
  <script src="/Components/js/auth-client.js"></script>
  <script>
    // Post-OAuth landing: the Microsoft callback set the session cookie but
    // the role is only known after asking the server. Cache display info and
    // route admins to the dashboard, everyone else home.
    (async function () {
      const session = await window.PeasAuth.getSession();
      if (!session) {
        window.location.replace('/log-in.html?error=session');
        return;
      }
      window.PeasAuth.storeUserInfo(session);
      window.location.replace(
        session.role === 'admin'
          ? '/admin/dashboard.html'
          : session.role === 'publisher'
            ? '/admin/Components/news.html'
            : '/index.html'
      );
    })();
  </script>
</body>
</html>
